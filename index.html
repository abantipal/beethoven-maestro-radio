<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beethoven Maestro Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0b0a;
            --bg-card: rgba(22, 18, 16, 0.85);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #997a15;
            --text-main: #f0e6d2;
            --text-muted: #a39580;
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(139, 0, 0, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
        }

        #splash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 8, 7, 0.96);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.6s ease;
        }

        #splash-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .splash-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .btn-enter {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 16px 40px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            margin-top: 20px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--gold-primary);
            text-align: center;
            margin-bottom: 15px;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .app-container { grid-template-columns: 1.2fr 0.8fr; }
        }

        .player-card, .queue-card, .soundboard-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .stage-box {
            width: 150px; height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 20%, #000 80%);
            border: 3px solid var(--gold-primary);
            margin: 0 auto 15px;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Cinzel', serif; font-weight: 900; color: var(--gold-primary);
        }

        .stage-box.playing { animation: spinVinyl 12s linear infinite; }
        @keyframes spinVinyl { 100% { transform: rotate(360deg); } }

        .track-info { text-align: center; margin-bottom: 15px; }
        .track-title { font-family: 'Cinzel', serif; color: var(--gold-light); font-size: 1.2rem; }
        .track-movement { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .status-badge {
            display: inline-block; font-size: 0.75rem; padding: 4px 12px;
            border-radius: 12px; background: rgba(212, 175, 55, 0.15);
            color: var(--gold-primary); border: 1px solid var(--border-gold);
            margin-top: 8px; text-transform: uppercase;
        }

        .controls { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
        .btn-ctrl {
            background: transparent; border: 1px solid var(--border-gold);
            color: var(--gold-primary); width: 44px; height: 44px;
            border-radius: 50%; cursor: pointer; font-size: 1rem;
        }
        .btn-main { background: var(--gold-primary); color: #000; font-size: 1.3rem; border: none; }

        input[type="range"] { width: 100%; accent-color: var(--gold-primary); cursor: pointer; }
        .time-display { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

        .queue-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
        .queue-item {
            padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03);
            display: flex; justify-content: space-between; cursor: pointer; font-size: 0.85rem;
        }
        .queue-item.active { background: rgba(212, 175, 55, 0.2); border: 1px solid var(--gold-primary); }

        .soundboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 10px; }
        .btn-fx {
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-gold);
            color: var(--text-main); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div id="splash-overlay">
        <h1 class="splash-title">Beethoven Radio</h1>
        <p style="color: var(--text-muted);">Masterworks Streaming Engine</p>
        <button class="btn-enter" onclick="unlockAudio()">Enter Concert Hall</button>
    </div>

    <header>
        <h1>Beethoven Maestro Radio</h1>
    </header>

    <div class="app-container">
        <div class="player-card">
            <div class="stage-box" id="vinyl-stage">LvB</div>
            <div class="track-info">
                <h2 class="track-title" id="track-title">Select Track</h2>
                <p class="track-movement" id="track-movement">Concert Queue</p>
                <span class="status-badge" id="status-badge">Standby</span>
            </div>

            <input type="range" id="seek-bar" value="0" min="0" max="100" onchange="seekAudio(this.value)">
            <div class="time-display">
                <span id="curr-time">0:00</span>
                <span id="dur-time">0:00</span>
            </div>

            <div class="controls">
                <button class="btn-ctrl" onclick="prevTrack()">⏮</button>
                <button class="btn-ctrl btn-main" id="btn-play" onclick="togglePlay()">▶</button>
                <button class="btn-ctrl" onclick="nextTrack()">⏭</button>
            </div>

            <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                <span style="font-size:0.8rem;">🔈</span>
                <input type="range" id="volume-bar" value="0.8" min="0" max="1" step="0.05" oninput="setVolume(this.value)">
                <span style="font-size:0.8rem;">🔊</span>
            </div>
        </div>

        <div class="queue-card">
            <h3 style="font-family:'Cinzel'; color:var(--gold-primary); margin-bottom:10px;">Queue</h3>
            <ul class="queue-list" id="queue-list"></ul>
        </div>

        <div class="soundboard-card" style="grid-column: 1 / -1;">
            <h3 style="font-family:'Cinzel'; color:var(--gold-primary); margin-bottom:10px;">Soundboard Overlays</h3>
            <div class="soundboard-grid">
                <button class="btn-fx" onclick="playFX('timpani')">🥁 Timpani Roll</button>
                <button class="btn-fx" onclick="playFX('applause')">👏 Hall Ovation</button>
                <button class="btn-fx" onclick="playFX('harpsichord')">🎹 Harpsichord</button>
                <button class="btn-fx" onclick="playFX('violin')">🎻 Violin Tremolo</button>
                <button class="btn-fx" onclick="playFX('a440')">🎵 A440 Pitch</button>
            </div>
        </div>
    </div>

    <!-- HTML5 Audio Engine -->
    <audio id="audio-engine" preload="auto"></audio>

    <script>
        // Internet Archive Public Domain Streams (CORS Allowed)
        const playlist = [
            {
                title: "Symphony No. 5 in C minor",
                movement: "Op. 67 - I. Allegro con brio",
                durationStr: "7:28",
                url: "https://ia800301.us.archive.org/29/items/lp_symphony-no-5-in-c-minor-symphony-no-34-i_ludwig-van-beethoven-wolfgang-amadeus-moza/lp_symphony-no-5-in-c-minor-symphony-no-34-i_ludwig-van-beethoven-wolfgang-amadeus-moza_disc1side1.mp3"
            },
            {
                title: "Piano Sonata No. 14 'Moonlight'",
                movement: "Op. 27 No. 2 - I. Adagio sostenuto",
                durationStr: "5:36",
                url: "https://ia800501.us.archive.org/31/items/lp_moonlight-sonata-number-14-in-c-opus-27-2_ludwig-van-beethoven/lp_moonlight-sonata-number-14-in-c-opus-27-2_ludwig-van-beethoven_disc1side1.mp3"
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let audioCtx = null;

        const audio = document.getElementById('audio-engine');
        const playBtn = document.getElementById('btn-play');
        const trackTitle = document.getElementById('track-title');
        const trackMovement = document.getElementById('track-movement');
        const statusBadge = document.getElementById('status-badge');
        const vinylStage = document.getElementById('vinyl-stage');
        const seekBar = document.getElementById('seek-bar');
        const currTimeLabel = document.getElementById('curr-time');
        const durTimeLabel = document.getElementById('dur-time');

        function initQueueUI() {
            const listEl = document.getElementById('queue-list');
            listEl.innerHTML = '';
            playlist.forEach((track, idx) => {
                const li = document.createElement('li');
                li.className = `queue-item ${idx === currentIndex ? 'active' : ''}`;
                li.onclick = () => selectTrack(idx);
                li.innerHTML = `<div><strong>${track.title}</strong><br><small style="color:var(--text-muted)">${track.movement}</small></div><div>${track.durationStr}</div>`;
                listEl.appendChild(li);
            });
        }

        function unlockAudio() {
            document.getElementById('splash-overlay').classList.add('hidden');
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            loadTrack(0, true);
        }

        function loadTrack(idx, autoPlay = false) {
            currentIndex = idx;
            const track = playlist[currentIndex];
            trackTitle.innerText = track.title;
            trackMovement.innerText = track.movement;
            statusBadge.innerText = "Buffering...";
            durTimeLabel.innerText = track.durationStr;
            initQueueUI();

            audio.src = track.url;
            audio.load();

            if (autoPlay) playAudio();
            else pauseAudio();
        }

        function playAudio() {
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerText = '⏸';
                statusBadge.innerText = 'Streaming';
                vinylStage.classList.add('playing');
            }).catch(() => {
                statusBadge.innerText = 'Tap Play';
                isPlaying = false;
                playBtn.innerText = '▶';
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playBtn.innerText = '▶';
            statusBadge.innerText = 'Paused';
            vinylStage.classList.remove('playing');
        }

        function togglePlay() { isPlaying ? pauseAudio() : playAudio(); }
        function nextTrack() { loadTrack((currentIndex + 1) % playlist.length, true); }
        function prevTrack() { loadTrack((currentIndex - 1 + playlist.length) % playlist.length, true); }
        function selectTrack(idx) { loadTrack(idx, true); }
        function seekAudio(val) { if (audio.duration) audio.currentTime = (val / 100) * audio.duration; }
        function setVolume(val) { audio.volume = val; }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                seekBar.value = (audio.currentTime / audio.duration) * 100;
                const m = Math.floor(audio.currentTime / 60);
                const s = Math.floor(audio.currentTime % 60);
                currTimeLabel.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }
        });

        audio.addEventListener('ended', nextTrack);
        audio.addEventListener('error', () => { statusBadge.innerText = 'Stream Unavailable'; });

        function playFX(type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = type === 'timpani' ? 110 : 440;
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 1.0);
        }

        initQueueUI();
    </script>
</body>
</html>
